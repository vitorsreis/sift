name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Build PHAR
        run: composer build:phar

      - name: Smoke test PHAR
        run: php build/phar/sift.phar --no-pretty help

      - name: Verify checksum
        run: cd build/phar && sha256sum -c sift.phar.sha256

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: build/phar/sift.phar

      - name: Build release notes
        run: |
          cat <<EOF > release-notes.md
          See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the full list of changes.
          EOF

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            build/phar/sift.phar
            build/phar/sift.phar.sha256
