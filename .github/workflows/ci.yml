name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        php:
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, sodium
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Quality
        run: composer quality

      - name: Build PHAR
        run: composer build:phar

      - name: Smoke test PHAR
        run: php build/phar/sift.phar help

      - name: Validate exported Composer package
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.3'
        shell: bash
        run: |
          rm -rf build/composer-package
          mkdir -p build/composer-package/export build/composer-package/install
          composer archive --format=zip --dir=build/composer-package/export
          unzip -q build/composer-package/export/*.zip -d build/composer-package/source
          package_dir="$(find build/composer-package/source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          composer --working-dir "$package_dir" validate --strict
          composer --working-dir build/composer-package/install init --name=fixture/project --no-interaction
          composer config --working-dir build/composer-package/install repositories.sift path "$(pwd)/$package_dir"
          composer config --working-dir build/composer-package/install allow-plugins.vitorsreis/sift true
          composer --working-dir build/composer-package/install require vitorsreis/sift:* --no-interaction --no-progress
          php build/composer-package/install/vendor/bin/sift version
