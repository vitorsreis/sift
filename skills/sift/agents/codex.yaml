name: sift
description: Use Sift as the project quality, tooling, history, and skills command layer for PHP repositories.
instructions:
  - Prefer `composer sift --compact <tool>` for supported PHP tools.
  - Use `--json` only when structured machine output is required.
  - Use `--no-json` to force terminal output when config selects JSON.
  - Use `composer skills <command>` for skill installation, preview, update, and removal.
  - Inspect `composer sift history view <run_id> <section>` before rerunning noisy tools.
  - Treat `help`, `version`, and `tools list` as terminal-only commands.
  - Keep Composer commands read-only through Sift: audit, licenses, outdated, show.
  - Keep refactor and formatter tools in dry-run or check mode unless the user explicitly asks for repair.
  - Use `--raw` only when native output is necessary; policies still apply.
