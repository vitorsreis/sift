<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Sift v2 preview</title>
  <desc id="desc">Sift v2 terminal and payload preview showing compact commands, versioned schema, history, and skill targets.</desc>
  <rect width="1040" height="560" fill="#f8fafc"/>
  <rect x="32" y="32" width="976" height="496" rx="18" fill="#0b1020"/>
  <rect x="32" y="32" width="976" height="52" rx="18" fill="#111827"/>
  <circle cx="62" cy="58" r="7" fill="#ef4444"/>
  <circle cx="86" cy="58" r="7" fill="#f59e0b"/>
  <circle cx="110" cy="58" r="7" fill="#22c55e"/>
  <text x="138" y="64" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">Sift v2 - PHP tooling filtered for agents</text>

  <rect x="64" y="116" width="432" height="164" rx="10" fill="#111827" stroke="#334155"/>
  <text x="88" y="148" fill="#93c5fd" font-family="Consolas, monospace" font-size="15">$ composer sift --compact pest</text>
  <text x="88" y="184" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">{ "tool": "pest",</text>
  <text x="88" y="210" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">  "status": "failed",</text>
  <text x="88" y="236" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">  "summary": { "tests": 184, "failures": 1 },</text>
  <text x="88" y="262" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">  "meta": { "run_id": "run_9f..." } }</text>

  <rect x="544" y="116" width="432" height="164" rx="10" fill="#111827" stroke="#334155"/>
  <text x="568" y="148" fill="#86efac" font-family="Consolas, monospace" font-size="15">$ composer sift history view run_9f... items</text>
  <text x="568" y="184" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">{ "items": [</text>
  <text x="568" y="210" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">  { "type": "test_failure",</text>
  <text x="568" y="236" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">    "file": "tests/Feature/CheckoutTest.php",</text>
  <text x="568" y="262" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">    "line": 42 } ] }</text>

  <rect x="64" y="320" width="432" height="136" rx="10" fill="#111827" stroke="#334155"/>
  <text x="88" y="352" fill="#fbbf24" font-family="Consolas, monospace" font-size="15">"$schema"</text>
  <text x="88" y="382" fill="#e5e7eb" font-family="Consolas, monospace" font-size="13">https://raw.githubusercontent.com/vitorsreis/sift/</text>
  <text x="88" y="408" fill="#e5e7eb" font-family="Consolas, monospace" font-size="13">v2.0.0/resources/schema.json</text>
  <text x="88" y="434" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Config is pinned to the installed release.</text>

  <rect x="544" y="320" width="432" height="136" rx="10" fill="#111827" stroke="#334155"/>
  <text x="568" y="352" fill="#c4b5fd" font-family="Consolas, monospace" font-size="15">$ composer skills add sift --agent=codex --yes</text>
  <text x="568" y="388" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">Targets: codex, cursor, claude-code, copilot,</text>
  <text x="568" y="414" fill="#e5e7eb" font-family="Consolas, monospace" font-size="14">gemini, generic, vscode</text>
  <text x="568" y="440" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Managed blocks preserve manual instructions.</text>

  <text x="64" y="500" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Policies run before native tools, including raw mode. Output stays JSON unless passthrough is explicit.</text>
</svg>
